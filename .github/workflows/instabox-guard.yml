name: instabox-guard
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ping port endpoint (external traffic counts as use)
        run: |
          curl -s -o /dev/null -w "ping: HTTP %{http_code}\n" -m 20 https://6969-agq3lyj6bjtya2d7yswujhmske.instabox.tech/ || true

      - name: run-age guard (reset before the 480-min ceiling, resume if paused)
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
        run: |
          set -u
          MID=m_agq3lyj6bjtya2d7yswujhmske
          API="https://api.instabox.sh/v1/machines/$MID"
          AUTH=(-H "X-API-Key: $INSTABOX_API_KEY" -H "Content-Type: application/json")
          get() { curl -sf -m 20 "${AUTH[@]}" "$API"; }
          M=$(get) || { echo "GET machine failed"; exit 1; }
          state=$(printf '%s' "$M" | python3 -c 'import json,sys;print(json.load(sys.stdin)["state"])')
          started=$(printf '%s' "$M" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("runStartedAt") or "")')
          echo "state=$state runStartedAt=$started"
          resume() {
            for i in 1 2 3 4 5; do
              r=$(curl -s -m 60 "${AUTH[@]}" -H "Idempotency-Key: gh-r-$(date +%s)-$i" -X POST "$API/resume" -d '{}')
              echo "resume#$i: $r"
              printf '%s' "$r" | grep -q '"state":"queued"\|"state":"succeeded"\|"state":"running"' && return 0
              printf '%s' "$r" | grep -q machine_cooldown && { echo "in cooldown; next scheduled run retries"; return 1; }
              sleep 6
            done
            w=$(curl -s -m 60 "${AUTH[@]}" -H "Idempotency-Key: gh-w-$(date +%s)" -X POST "$API/wake" -d '{}')
            echo "wake fallback: $w"
          }
          if [ "$state" = "suspended" ] || [ "$state" = "paused" ]; then
            echo "machine paused; attempting resume"
            resume
            exit 0
          fi
          [ "$state" = "running" ] || { echo "state $state; nothing to do"; exit 0; }
          [ -n "$started" ] || { echo "no runStartedAt; skip"; exit 0; }
          age=$(( $(date +%s) - $(date -d "$started" +%s) ))
          echo "run age: $((age/60)) min"
          if [ "$age" -ge 24000 ]; then
            echo "age >= 400 min: self suspend+resume resets the run clock; a self-requested pause owes no cooldown"
            s=$(curl -s -m 30 "${AUTH[@]}" -H "Idempotency-Key: gh-s-$(date +%s)" -X POST "$API/suspend" -d '{}')
            echo "suspend: $s"
            for i in $(seq 1 12); do
              st=$(get | python3 -c 'import json,sys;print(json.load(sys.stdin)["state"])' 2>/dev/null || echo unknown)
              echo "post-suspend state: $st"
              [ "$st" = "suspended" ] && break
              sleep 6
            done
            resume
          fi
